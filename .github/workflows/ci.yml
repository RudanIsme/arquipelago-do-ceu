name: CI

on:
  pull_request:
  push:
    branches: [main]

# Uma execução nova do mesmo PR cancela a anterior; os pushes na main nunca são cancelados, para cada commit ter seu resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Rodar os testes
        run: dotnet test game.tests

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Instalar o Godot e as templates de exportação
        run: |
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_win64.zip" -OutFile godot.zip
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_export_templates.tpz" -OutFile templates.zip
          Expand-Archive godot.zip -DestinationPath "$env:RUNNER_TEMP\godot"
          Expand-Archive templates.zip -DestinationPath "$env:RUNNER_TEMP\templates"
          # O Godot procura as templates numa pasta com o nome exato da versão.
          $destino = "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable.mono"
          New-Item -ItemType Directory $destino -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\templates\templates\*" $destino -Recurse
          $console = Get-ChildItem "$env:RUNNER_TEMP\godot" -Recurse -Filter "*_console.exe" | Select-Object -First 1
          "GODOT=$($console.FullName)" >> $env:GITHUB_ENV
      - name: Copiar o conteúdo para o projeto do jogo
        run: |
          New-Item -ItemType Directory game/content -Force | Out-Null
          Copy-Item content/* game/content -Recurse -Force
      - name: Exportar para Windows
        run: |
          New-Item -ItemType Directory build -Force | Out-Null
          & $env:GODOT --headless --path game --import
          $log = & $env:GODOT --headless --path game --export-release "Windows Desktop" 2>&1 | ForEach-Object { $linha = "$_"; Write-Host $linha; $linha }
          # O Godot termina com saída 0 e gera o executável mesmo quando a exportação deu erro
          # (por exemplo, sem o .sln o código C# fica de fora); por isso a saída também é conferida.
          if ($LASTEXITCODE -ne 0 -or ($log -match '^ERROR:') -or -not (Test-Path build/ArquipelagoDoCeu.exe)) { Write-Error "A exportação falhou."; exit 1 }
      - name: Abrir o executável exportado
        run: |
          Get-ChildItem build -Recurse | ForEach-Object { $_.FullName.Replace("$PWD\", "") }
          $saida = & build/ArquipelagoDoCeu.console.exe --headless --verbose --quit-after 30 2>&1 | Out-String
          $codigo = $LASTEXITCODE
          Write-Host "Saída ($codigo):"; Write-Host $saida
          if ($codigo -ne 0 -or $saida -notmatch "Cena inicial pronta") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/
