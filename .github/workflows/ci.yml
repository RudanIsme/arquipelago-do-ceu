name: CI

on:
  pull_request:
  push:
    branches: [main]

# Uma execução nova do mesmo PR cancela a anterior; os pushes na main nunca são cancelados, para cada commit ter seu resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Rodar os testes
        run: dotnet test game.tests
